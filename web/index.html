<body>
  <script>
    // Open-in-app fallback for WhatsApp cart/product links. If Android did not
    // route the link straight into the app (domain not verified yet), show a
    // button that launches the app by package name, which needs no verification.
    (function () {
      try {
        var ua = navigator.userAgent || '';
        var u = new URL(location.href);
        if (!/Android/i.test(ua)) return;
        if (u.searchParams.get('noapp') === '1') return;
        if (!/^\/(cart|products?|orders)(\/|$)/.test(u.pathname)) return;
        var fromWa = u.searchParams.get('utm_source') === 'whatsapp' || !!u.searchParams.get('wcr');
        var fb = new URL(location.href); fb.searchParams.set('noapp', '1');
        var intent = 'intent://' + u.host + u.pathname + u.search + '#Intent;scheme=https;package=com.bakaloo.india;S.browser_fallback_url=' + encodeURIComponent(fb.toString()) + ';end';
        window.addEventListener('DOMContentLoaded', function () {
          var a = document.createElement('a');
          a.href = intent;
          a.textContent = 'Open in Bakaloo app';
          a.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:2147483647;padding:14px;border-radius:10px;background:#16a34a;color:#fff;font:600 16px sans-serif;text-align:center;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.3)';
          document.body.appendChild(a);
        });
        if (fromWa) {
          // Browsers block an app launch that is not caused by a tap, so also
          // launch on the customer's first touch anywhere on the page.
          var fired = false;
          var go = function () { if (fired) return; fired = true; location.href = intent; };
          ['touchend', 'pointerup', 'click'].forEach(function (t) { window.addEventListener(t, go, { capture: true, once: true }); });
          location.replace(intent);
        }
      } catch (e) {}
    })();
  </script>
