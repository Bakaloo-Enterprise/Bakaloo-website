<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- Primary SEO -->

  <meta name="description" content="Order fresh vegetables, fruits, dairy, snacks and daily essentials online from Bakaloo. Fast grocery delivery in 59 minutes, zero platform fees and the lowest prices.">

  <meta name="author" content="Bakaloo">
  <link rel="canonical" href="https://bakaloo.in/">
  <meta name="theme-color" content="#663399">

  <!-- Open Graph / social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Bakaloo">
  <meta property="og:title" content="Bakaloo - Online Grocery Delivery in 59 Minutes">
  <meta property="og:description" content="Fresh vegetables, fruits, dairy and daily essentials delivered in 59 minutes. Zero platform fees, lowest prices.">
  <meta property="og:url" content="https://bakaloo.in/">
  <meta property="og:image" content="https://bakaloo.in/icons/Icon-512.png">
  <meta property="og:locale" content="en_IN">
  <meta name="twitter:card" content="summary">

  <meta name="twitter:description" content="Fresh vegetables, fruits, dairy and daily essentials delivered in 59 minutes.">
  <meta name="twitter:image" content="https://bakaloo.in/icons/Icon-512.png">

  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://bakaloo.in/#org",
        "name": "Bakaloo",
        "url": "https://bakaloo.in/",
        "logo": "https://bakaloo.in/icons/Icon-512.png"
      },
      {
        "@type": "WebSite",
        "@id": "https://bakaloo.in/#website",
        "url": "https://bakaloo.in/",
        "name": "Bakaloo",
        "description": "Online grocery delivery in 59 minutes.",
        "publisher": { "@id": "https://bakaloo.in/#org" },
        "inLanguage": "en-IN"
      }
    ]
  }
  </script>

  <!-- iOS / PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bakaloo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

    <p>Order fresh vegetables, fruits, dairy, snacks and daily essentials online. Free delivery, zero platform fees and the lowest prices.</p>
